# The calendar slowapp: a household's Google and iCloud calendars (and secret iCal addresses),
# tagged hidden / regular / important by its own AI key, as an agenda for one third of the board.
# A port of epaper-dashboard tools/calsync.py to contract 6 (the secrets track's S6): `sync` fetches
# with the secrets and writes the `agenda` artifact; `render` draws it with neither.
[app]
id = "calendar"
title = "Calendar"
contract = 6
image = "ghcr.io/slowboard-io/slowapp-calendar"
memory = "64m"
tmp = "8m"
timeout_s = 120
network = "egress"               # the sync jobs' default; render never has the network (contract 6)
data = { max_mb = 4 }            # sync's state: the last good fetch per account and the AI's tag cache
blurb = "Your Google and iCloud calendars, with only what matters on the wall."
about = "The next two weeks from your Google accounts, iCloud and any iCal address, sorted by your own AI key into hidden, regular and important: weekly work meetings and private appointments stay off the wall, occasions and trips are in red. Set any event yourself and the AI leaves it alone."
ink = "red"
repo = "https://github.com/slowboard-io/slowapp-calendar"

# What the AI is asked through: a decision model (shared context and choice questions in, calibrated
# probabilities out), with the household's own key (the ai_key secret). Jev is TypeSafe's on
# DigitalOcean's System One API; gemini is Google's decisions API. Endpoint and model default to the
# provider's.
[settings]
ai_provider = { type = "string", default = "jev", label = "AI provider", help = "jev (DigitalOcean System One) or gemini (Google). The key is the AI key secret." }
ai_base_url = { type = "string", default = "", label = "AI endpoint", help = "Leave empty for the provider's own." }
ai_model = { type = "string", default = "", label = "AI model", help = "Leave empty for the provider's: typesafe-jev-1.13.0 or gemini-decision-1." }
ai_hour = { type = "integer", default = 5, min = 0, max = 23, label = "Daily AI run from (hour)", help = "New events are tagged by the AI once a day, at the first sync from this hour; by rules until then." }

# ---------------------------------------------------------------- secrets (contract 6)

[secrets.google]
kind = "oauth"
auth = "google"
multiple = true
optional = true                  # the sync needs at least one of google, icloud and ical_url
label = "Google Calendar"
help = "Read-only access to your calendars. Connect each Google account whose calendars you want on the wall."

[secrets.icloud]
label = "iCloud calendars"
help = "Your Apple ID and an app-specific password (account.apple.com, Sign-In and Security), as apple-id:password. Not your Apple ID password."
optional = true

[secrets.ical_url]
label = "Secret iCal addresses"
help = "A calendar's secret address in iCal format (Google Calendar: Settings, Integrate calendar), one per line. Anyone with it can read the calendar."
optional = true

[secrets.ai_key]
label = "AI key"
help = "Your key for the AI provider in the settings (jev: a DigitalOcean model access key; gemini: a Gemini API key). Without one, events are tagged by simple rules."
optional = true

[auth.google]
label = "Google"
authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
token_url = "https://oauth2.googleapis.com/token"
revoke_url = "https://oauth2.googleapis.com/revoke"
scopes = ["https://www.googleapis.com/auth/calendar.readonly", "openid", "email"]
pkce = true
params = { access_type = "offline", prompt = "consent" }

[artifacts.agenda]
max_kb = 256                     # agenda.json: calsync's agenda shape, ~2 weeks of rows

# ---------------------------------------------------------------- docs (calsync's files)

# {series: {tag, by, why, at}}: the household's tags (by "user"); calsync's AI tags (by "ai") are
# taken as cached. tags.json in the legacy dashboard.
[docs.tags]
max_kb = 256
writer = "ui"
on_change = ["sync"]

# {series: "display name"}: the wall's name for a series. names.json.
[docs.names]
max_kb = 64
writer = "ui"
on_change = ["sync"]

# {"series": {series: {title, calendar, next, count, tag, by, why}}, "at"}: every upcoming series and
# its tag, for the page's "What's on the wall" list. The sync job writes it when it changed; the page
# reads it and sets a tag by writing docs.tags (by "user").
[docs.upcoming]
max_kb = 128
writer = "job"

# {cal_key: false}: calendars left off the wall. settings.json's calendars[*].show.
[docs.shown]
max_kb = 16
writer = "ui"
on_change = ["sync"]

# The page: connect calendars and the AI key (value secrets through the bridge's secrets.set, sealed
# on the hub), the AI provider, and Sync now. Google connects through the bridge's secrets.connect
# (protocol 2; on a hub without it the page says so), and a Google calendar's secret
# iCal address works meanwhile. "What's on the wall" lists docs.upcoming with Hidden / Regular /
# Important / Auto per series, written to docs.tags. Still to come: the calendar picker
# (docs.shown) and renaming a series (docs.names).
[ui]
entry = "/ui/index.html"

# ---------------------------------------------------------------- jobs

[[job]]
name = "sync"
kind = "sync"
every = "15m"
min_every = "15m"
network = "egress"
secrets = ["google", "icloud", "ical_url", "ai_key"]
args = { ai = "boolean" }       # true: tag new series with the AI now instead of at the daily run
expected_s = 20

[[job]]
name = "calendars"
kind = "sync"
network = "egress"
secrets = ["google", "icloud", "ical_url"]
expected_s = 10

[[job]]
name = "render"
inputs = ["self:agenda"]
expected_s = 3

[[feed]]
name = "agenda"
size = "slot"

# The whole screen of a 4.7" 16-grey board standing tall (the Slowboard 470): the agenda as a list,
# the day large at the top, important events inverted, holidays on a grey band.
[[feed]]
name = "full"
size = "540x960"
inks = ["g16"]

# ---------------------------------------------------------------- examples

[[example]]
name = "default"
caption = "Mon 19 Oct 2026 09:00: two weeks from a Google account, iCloud and an iCal address, AI-tagged"
fixture = "fixtures/default"
now = "2026-10-19T09:00:00-07:00"
feeds = { agenda = "452x444.k4" }

[[example]]
name = "middle"
caption = "The same agenda in the middle third, Thursday evening"
fixture = "fixtures/default"
now = "2026-10-22T17:30:00-07:00"
feeds = { agenda = "456x444.k4" }

[[example]]
name = "empty"
caption = "Before the first sync: no calendar connected yet"
fixture = "fixtures/empty"
now = "2026-10-19T09:00:00-07:00"
feeds = { agenda = "452x444.k4" }

[[example]]
name = "full"
caption = "Mon 19 Oct 2026 09:00 on a Slowboard 470: the whole 540x960 greyscale screen"
fixture = "fixtures/default"
now = "2026-10-19T09:00:00-07:00"
feeds = { full = "540x960.g16" }
